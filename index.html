<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3B82F6" id="meta-theme-color" />
  <meta name="description" content="WeatherFlow – moderní počasí podle vaší polohy" />

  <!-- PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="WeatherFlow" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <title>WeatherFlow</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="theme-auto">

  <!-- ===== SPLASH / LOADING SCREEN ===== -->
  <div id="splash" class="splash" aria-live="polite" aria-busy="true">
    <div class="splash-inner">
      <div class="splash-icon">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="url(#splashGrad)" />
          <path d="M20 36 Q24 28 32 30 Q36 22 44 26 Q50 26 50 34 Q50 40 44 40 H22 Q16 40 16 34 Q16 30 20 36Z" fill="white" opacity="0.9"/>
          <defs>
            <linearGradient id="splashGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#60A5FA"/>
              <stop offset="100%" stop-color="#3B82F6"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1 class="splash-title">WeatherFlow</h1>
      <p class="splash-sub" id="splash-status">Zjišťuji vaši polohu…</p>
      <div class="splash-spinner" aria-hidden="true"></div>
    </div>
  </div>

  <!-- ===== MAIN APP ===== -->
  <div id="app" class="app hidden" role="main">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="app-logo" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="30" fill="url(#logoGrad)"/>
            <path d="M20 36 Q24 28 32 30 Q36 22 44 26 Q50 26 50 34 Q50 40 44 40 H22 Q16 40 16 34 Q16 30 20 36Z" fill="white" opacity="0.9"/>
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#60A5FA"/>
                <stop offset="100%" stop-color="#3B82F6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="app-name">WeatherFlow</span>
      </div>
      <div class="header-right">
        <!-- Theme toggle -->
        <button class="icon-btn" id="theme-toggle" aria-label="Přepnout světlý/tmavý režim" title="Přepnout režim">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <!-- GPS refresh -->
        <button class="icon-btn" id="gps-btn" aria-label="Zjistit aktuální polohu" title="Aktuální poloha">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Search bar -->
    <div class="search-container">
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="search"
          id="city-search"
          class="search-input"
          placeholder="Hledat město…"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          aria-label="Hledat město"
        />
        <button class="search-clear hidden" id="search-clear" aria-label="Vymazat">✕</button>
      </div>
      <ul class="search-results hidden" id="search-results" role="listbox" aria-label="Výsledky vyhledávání"></ul>
    </div>

    <!-- Error banner -->
    <div class="error-banner hidden" id="error-banner" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="error-text"></span>
    </div>

    <!-- ===== CURRENT WEATHER CARD ===== -->
    <section class="current-card" aria-label="Aktuální počasí">
      <div class="current-top">
        <div class="location-block">
          <div class="location-name">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>
            <span id="city-name">–</span>
          </div>
          <div class="updated-time" id="updated-time">–</div>
        </div>
        <div class="weather-icon-wrap" id="main-weather-icon" aria-hidden="true">
          <!-- SVG icon injected by JS -->
        </div>
      </div>

      <div class="temp-block">
        <div class="temp-main" id="temp-main">–</div>
        <div class="temp-feels">
          Pocitová <span id="temp-feels">–</span>
        </div>
      </div>

      <div class="weather-desc" id="weather-desc">–</div>

      <!-- Detail grid -->
      <div class="detail-grid">
        <div class="detail-item">
          <svg class="detail-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
          </svg>
          <span class="detail-label">Vlhkost</span>
          <span class="detail-value" id="d-humidity">–</span>
        </div>
        <div class="detail-item">
          <svg class="detail-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
            <path d="M16 14v6M8 14v6M12 16v6"/>
          </svg>
          <span class="detail-label">Srážky</span>
          <span class="detail-value" id="d-precip">–</span>
        </div>
        <div class="detail-item">
          <svg class="detail-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/>
            <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
          </svg>
          <span class="detail-label">Vítr</span>
          <span class="detail-value" id="d-wind">–</span>
        </div>
        <div class="detail-item">
          <svg class="detail-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 15h18M3 9h18M8 3v18M16 3v18" opacity="0.3"/>
            <circle cx="12" cy="12" r="4"/>
          </svg>
          <span class="detail-label">Tlak</span>
          <span class="detail-value" id="d-pressure">–</span>
        </div>
        <div class="detail-item">
          <svg class="detail-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          </svg>
          <span class="detail-label">UV index</span>
          <span class="detail-value" id="d-uv">–</span>
        </div>
        <div class="detail-item">
          <svg class="detail-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <span class="detail-label">Viditelnost</span>
          <span class="detail-value" id="d-visibility">–</span>
        </div>
      </div>
    </section>

    <!-- ===== HOURLY FORECAST ===== -->
    <section class="forecast-section" aria-label="Hodinová předpověď">
      <h2 class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        Hodinová předpověď
      </h2>
      <div class="hourly-scroll" id="hourly-scroll" role="list">
        <!-- Injected by JS -->
      </div>
    </section>

    <!-- ===== DAILY FORECAST ===== -->
    <section class="forecast-section" aria-label="Týdenní předpověď">
      <h2 class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Týdenní předpověď
      </h2>
      <div class="daily-list" id="daily-list" role="list">
        <!-- Injected by JS -->
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      Data: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> &nbsp;·&nbsp; WeatherFlow
    </footer>

  </div><!-- /#app -->

  <script src="script.js"></script>
</body>
</html>
